# Sunshine Configuration Template for CouchPlay
# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2025 CouchPlay Contributors
#
# This is the MINIMAL config needed per CouchPlay streaming instance.
# CouchPlay should generate one of these per streaming instance at runtime.
#
# Config file format: INI-style (key = value)
# Config file location: passed as first CLI argument to sunshine binary
#
# Example: sunshine /tmp/couchplay-sunshine-0/sunshine.conf
#
# IMPORTANT: Each instance MUST have unique:
#   - port (base port for all services)
#   - output_name (display to capture)
#   - file paths (state, apps, log, credentials)

# =============================================================================
# NETWORK
# =============================================================================

# Base port - all other ports are offsets from this
# Offset +0:  HTTP (unencrypted)
# Offset +1:  HTTPS (Web UI)
# Offset +9:  Video stream (UDP)
# Offset +10: Control stream (UDP)
# Offset +11: Audio stream (UDP)
# Offset +21: RTSP setup (TCP)
# MUST be unique per instance. Recommended spacing: 30+ apart
port = 47989

# IP address family: ipv4 | both
address_family = ipv4

# Bind to specific address (optional, for multi-NIC)
# bind_address = 0.0.0.0

# Restrict Web UI access: pc | lan | wan
origin_web_ui_allowed = pc

# =============================================================================
# DISPLAY CAPTURE
# =============================================================================

# Display/output to capture. Value depends on capture backend:
#   - KMS/DRM: numeric connector index (logged at Sunshine startup)
#   - Wayland wlgrab: numeric output index (0, 1, 2...)
#   - X11: display name (e.g., ":0")
#   - XDG Portal: not configurable (user selects via dialog)
# For CouchPlay: set to the index of the virtual display created per instance
output_name = 0

# GPU adapter for encoding/capture (optional)
# Common values on Linux:
#   /dev/dri/renderD128  (first GPU)
#   /dev/dri/renderD129  (second GPU)
# adapter_name = /dev/dri/renderD128

# Capture backend (auto-detected, but can hint):
#   kms     - DRM/KMS direct capture (best performance on Wayland)
#   wayland - wlroots screencopy
#   x11     - X11 XFixes capture
#   nvfbc   - NVIDIA Frame Buffer Capture (legacy)
# capture = kms

# =============================================================================
# VIDEO ENCODING
# =============================================================================

# Encoder selection: auto | nvenc | vaapi | vulkan | software
# encoder = auto

# Maximum bitrate in kbps (sets ceiling for client-requested bitrate)
# max_bitrate = 20000

# Min FPS target (0 = half of client request)
# minimum_fps_target = 0

# =============================================================================
# AUDIO
# =============================================================================

# Audio sink for capture (PulseAudio/PipeWire sink name)
# Leave empty for default system sink
# For CouchPlay: set to the PipeWire sink associated with the virtual display
# sink = 

# Whether to stream audio to clients
# stream_audio = enabled

# =============================================================================
# CREDENTIALS
# =============================================================================

# Web UI and pairing credentials
# These can also be set via environment or Web UI
username = couchplay
password = couchplay

# =============================================================================
# FILE PATHS (per-instance)
# =============================================================================

# Applications list (JSON format)
file_apps = /tmp/couchplay-sunshine-INSTANCE/apps.json

# Runtime state file (pairing info, etc)
# file_state = /tmp/couchplay-sunshine-INSTANCE/sunshine_state.json

# Log file
log_file = /tmp/couchplay-sunshine-INSTANCE/sunshine.log

# Credentials file (alternative to inline username/password)
# credentials_file = /tmp/couchplay-sunshine-INSTANCE/credentials.json

# =============================================================================
# INPUT
# =============================================================================

# Gamepad emulation type: auto | xone | ds5 | switch
# auto: selects based on Moonlight client's controller type
gamepad = auto

# Enable/disable input types
controller = enabled
keyboard = enabled
mouse = enabled

# =============================================================================
# DISPLAY NAME
# =============================================================================

# How this instance appears in Moonlight client
sunshine_name = CouchPlay Player INSTANCE

# =============================================================================
# PREP COMMANDS (optional)
# =============================================================================

# Commands to run before/after streaming sessions
# Can be used to set up/tear down virtual displays
# global_prep_cmd = [{"do":"/path/to/setup.sh","undo":"/path/to/cleanup.sh","elevated":false}]
