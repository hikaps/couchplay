#
# PipeWire PulseAudio TCP listener for cross-user audio routing.
# Installed system-wide in pipewire-pulse.conf.d (the helper no longer writes a per-user copy).
# This allows gaming users to route audio through the compositor's PipeWire.

pulse.properties = {
    server.address = [
        "unix:native"
        "tcp:127.0.0.1:4713"
    ]
}
