<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  TEST-ONLY permissive policy for the e2e container's system bus, so the
  user-run mock helper can own io.github.hikaps.CouchPlayHelper and the app
  can call it. (The real policy restricts ownership to root and calls to
  wheel/games.) Installed by appiumtests/Dockerfile.
-->
<busconfig>
  <policy context="default">
    <allow own="io.github.hikaps.CouchPlayHelper"/>
    <allow send_destination="io.github.hikaps.CouchPlayHelper"/>
    <allow receive_sender="io.github.hikaps.CouchPlayHelper"/>
  </policy>
</busconfig>
