name: Flatpak Build

on:
  push:
    branches: [ develop ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.ref_name }} origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on main branch. Releases must be tagged from main."
            exit 1
          fi

      - name: Build app from develop for beta
        if: github.ref == 'refs/heads/develop'
        run: |
          sed -i 's|"branch": "main"|"branch": "develop"|' io.github.hikaps.couchplay.json
          # Tell beta builds apart from the release they are based on (shown in Settings and --version)
          sed -i "s|\"-DBUILD_TESTING=OFF\"|\"-DBUILD_TESTING=OFF\",\n                \"-DCOUCHPLAY_BUILD_ID=beta-$(git rev-parse --short HEAD)\"|" io.github.hikaps.couchplay.json

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Cache Flatpak SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-kde-6.10-${{ runner.os }}

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install KDE SDK
        run: |
          flatpak install --user -y flathub org.kde.Sdk/x86_64/6.10 org.kde.Platform/x86_64/6.10

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo --default-branch=stable build-dir io.github.hikaps.couchplay.json

      - name: Assert sandbox permissions
        run: |
          grep -q 'io.github.hikaps.CouchPlayHelper=talk' build-dir/metadata \
            || { echo "::error::helper system-talk-name missing"; exit 1; }
          grep -qE '^devices=.*all' build-dir/metadata \
            || { echo "::error::--device=all missing"; exit 1; }
          grep -q '^com.github.CouchPlay=own' build-dir/metadata \
            || { echo "::error::com.github.CouchPlay must be own-name; a later talk-name downgrades it and the app exits at startup"; exit 1; }

      - name: Launch smoke (offscreen)
        continue-on-error: true
        run: |
          QT_QPA_PLATFORM=offscreen flatpak-builder --run build-dir io.github.hikaps.couchplay.json \
            bash -c 'dbus-run-session -- timeout 15 couchplay; c=$?; [ $c -eq 0 -o $c -eq 124 ]'

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo couchplay.flatpak io.github.hikaps.couchplay stable
          sha256sum couchplay.flatpak > couchplay.flatpak.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: |
            couchplay.flatpak
            couchplay.flatpak.sha256

      - name: Publish Flatpak to beta release
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          prerelease: true
          files: |
            couchplay.flatpak
            couchplay.flatpak.sha256

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            couchplay.flatpak
            couchplay.flatpak.sha256
