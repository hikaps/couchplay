name: Beta Release

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (required before checkout on a bare fedora:41 image)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh tar patchelf squashfs-tools

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -E "test_usermanager|test_couchplayhelper|test_gamescopeinstance|test_presetmanager_integration|test_commandverifier|test_devicemanager|test_heroicconfigmanager"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          mkdir -p release-appdir/bin
          mkdir -p release-appdir/data

          # Copy binaries
          cp build/bin/couchplay release-appdir/bin/
          cp build/bin/couchplay-helper release-appdir/bin/

          # Bundle the helper's runtime libs + assert the bundle landed (#28/#37).
          ./scripts/package-helper.sh release-appdir/bin/couchplay-helper

          # Copy scripts
          cp scripts/install-helper.sh release-appdir/
          chmod +x release-appdir/install-helper.sh

          # Copy data
          cp -r data/* release-appdir/data/

          # Create tarball
          tar -cJf couchplay-x86_64.tar.xz -C release-appdir .

          # Create systemd-sysext staging directory
          mkdir -p sysext-appdir/usr/local/bin
          mkdir -p sysext-appdir/usr/local/libexec
          mkdir -p sysext-appdir/usr/share/dbus-1/system.d
          mkdir -p sysext-appdir/usr/share/dbus-1/system-services
          mkdir -p sysext-appdir/usr/lib/systemd/system
          mkdir -p sysext-appdir/usr/share/polkit-1/actions
          mkdir -p sysext-appdir/usr/share/pipewire/pipewire-pulse.conf.d
          mkdir -p sysext-appdir/usr/share/applications
          mkdir -p sysext-appdir/usr/share/icons/hicolor/512x512/apps
          mkdir -p sysext-appdir/usr/share/metainfo
          mkdir -p sysext-appdir/usr/lib/extension-release.d

          # Copy binaries
          cp build/bin/couchplay sysext-appdir/usr/local/bin/
          cp build/bin/couchplay-helper sysext-appdir/usr/local/libexec/

          # Bundle helper's runtime libs for sysext
          ./scripts/package-helper.sh sysext-appdir/usr/local/libexec/couchplay-helper

          # Copy D-Bus and Polkit configs
          cp data/dbus/io.github.hikaps.CouchPlayHelper.conf sysext-appdir/usr/share/dbus-1/system.d/
          cp data/dbus/io.github.hikaps.CouchPlayHelper.service sysext-appdir/usr/share/dbus-1/system-services/
          cp data/dbus/couchplay-helper.service sysext-appdir/usr/lib/systemd/system/
          cp data/polkit/io.github.hikaps.couchplay.policy sysext-appdir/usr/share/polkit-1/actions/

          # Copy PipeWire PulseAudio listener configuration
          cp data/pipewire/50-couchplay.conf sysext-appdir/usr/share/pipewire/pipewire-pulse.conf.d/

          # Copy desktop integration files
          cp data/io.github.hikaps.couchplay.desktop sysext-appdir/usr/share/applications/
          cp data/icons/io.github.hikaps.couchplay.png sysext-appdir/usr/share/icons/hicolor/512x512/apps/
          cp data/io.github.hikaps.couchplay.metainfo.xml sysext-appdir/usr/share/metainfo/

          # Create extension-release file
          echo "ID=_any" > sysext-appdir/usr/lib/extension-release.d/extension-release.couchplay.steamos

          # Build squashfs raw image
          mksquashfs sysext-appdir couchplay.steamos.raw -noappend

      - name: Generate checksum
        run: |
          sha256sum couchplay-x86_64.tar.xz > couchplay-x86_64.sha256
          sha256sum couchplay.steamos.raw > couchplay.steamos.sha256

      - name: Generate release notes
        run: |
          echo "Latest build from **develop** branch." > body.md
          echo "" >> body.md
          echo "Commit: ${{ github.sha }}" >> body.md
          echo "" >> body.md
          echo "### Recent changes" >> body.md
          git log --oneline -10 >> body.md
          echo "" >> body.md
          echo "> ⚠️ This is a pre-release build for testing. Not for production use." >> body.md

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta (from develop)"
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            couchplay-x86_64.tar.xz
            couchplay-x86_64.sha256
            couchplay.steamos.raw
            couchplay.steamos.sha256
