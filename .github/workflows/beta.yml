name: Beta Release

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git and ccache (git is required before checkout on a bare fedora:41 image; tar and zstd for the cache action)
        run: dnf install -y git ccache tar zstd

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh dbus-daemon tar

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-beta-fedora41-${{ github.sha }}
          restore-keys: ccache-beta-fedora41-

      - name: Configure ccache
        run: |
          {
            echo "CCACHE_DIR=$PWD/.ccache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_MAXSIZE=500M"
          } >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCOUCHPLAY_BETA=ON
          -DCOUCHPLAY_BUILD_ID=beta-$(git rev-parse --short HEAD)
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel 2
          ccache --show-stats

      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure -E "test_gamescopeinstance|test_presetmanager_integration|test_commandverifier|test_devicemanager|test_heroicconfigmanager"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          mkdir -p release-appdir/bin
          mkdir -p release-appdir/data

          # Copy binaries
          cp build/bin/couchplay release-appdir/bin/
          cp build/bin/couchplay-vdisplay release-appdir/bin/
          cp build/bin/couchplay-padfwd release-appdir/bin/

          # Copy scripts
          cp scripts/couchplay-gamemode.sh release-appdir/
          chmod +x release-appdir/couchplay-gamemode.sh

          # Copy data
          cp -r data/* release-appdir/data/

          # Create tarball
          tar -cJf couchplay-x86_64.tar.xz -C release-appdir .

      - name: Generate checksum
        run: |
          sha256sum couchplay-x86_64.tar.xz > couchplay-x86_64.sha256

      - name: Generate release notes
        run: |
          echo "Latest build from **develop** branch." > body.md
          echo "" >> body.md
          echo "Commit: ${{ github.sha }}" >> body.md
          echo "" >> body.md
          echo "### Recent changes" >> body.md
          git log --oneline -10 >> body.md
          echo "" >> body.md
          echo "> ⚠️ This is a pre-release build for testing. Not for production use." >> body.md

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta (from develop)"
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            couchplay-x86_64.tar.xz
            couchplay-x86_64.sha256
