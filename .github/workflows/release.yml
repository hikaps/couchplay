name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (required before checkout on a bare fedora:41 image)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh tar patchelf squashfs-tools

      - name: Verify tag is on main branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.ref_name }} origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on main branch. Releases must be tagged from main."
            exit 1
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCOUCHPLAY_BETA=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -E "test_usermanager|test_couchplayhelper|test_gamescopeinstance|test_presetmanager_integration|test_commandverifier|test_devicemanager|test_heroicconfigmanager"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          mkdir -p release-appdir/bin
          mkdir -p release-appdir/data

          # Copy binaries
          cp build/bin/couchplay release-appdir/bin/
          cp build/bin/couchplay-helper release-appdir/bin/

          # Bundle the helper's runtime libs + assert the bundle landed (#28/#37).
          ./scripts/package-helper.sh release-appdir/bin/couchplay-helper

          # Copy scripts
          cp scripts/install-helper.sh release-appdir/
          chmod +x release-appdir/install-helper.sh
          cp scripts/couchplay-gamemode.sh release-appdir/
          chmod +x release-appdir/couchplay-gamemode.sh

          # Copy data
          cp -r data/* release-appdir/data/

          # Create tarball
          tar -cJf couchplay-x86_64.tar.xz -C release-appdir .

          # Build systemd-sysext raw image
          chmod +x scripts/build-sysext.sh
          ./scripts/build-sysext.sh couchplay.steamos.raw build/bin/couchplay-helper

      - name: Generate checksum
        run: |
          sha256sum couchplay-x86_64.tar.xz > couchplay-x86_64.sha256
          sha256sum couchplay.steamos.raw > couchplay.steamos.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            couchplay-x86_64.tar.xz
            couchplay-x86_64.sha256
            couchplay.steamos.raw
            couchplay.steamos.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            couchplay-x86_64.tar.xz
            couchplay-x86_64.sha256
            couchplay.steamos.raw
            couchplay.steamos.sha256
