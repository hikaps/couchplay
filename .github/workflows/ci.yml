name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git and ccache (git is required before checkout on a bare fedora:41 image; tar and zstd for the cache action)
        run: dnf install -y git ccache tar zstd

      - uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh dbus-daemon

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-fedora41-${{ github.sha }}
          restore-keys: ccache-fedora41-

      - name: Configure ccache
        run: |
          {
            echo "CCACHE_DIR=$PWD/.ccache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_MAXSIZE=500M"
          } >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -B build -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel 2
          ccache --show-stats

      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Application smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          trap 'rm -rf -- "$smoke_root"' EXIT
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/config"
          export XDG_DATA_HOME="$smoke_root/data"
          export XDG_CACHE_HOME="$smoke_root/cache"
          export XDG_RUNTIME_DIR="$smoke_root/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software

          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --help

          status=0
          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --start || status=$?
          printf 'Missing --profile: expected 2, got %s\n' "$status"
          test "$status" -eq 2

          status=0
          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --profile __couchplay_missing_smoke_profile__ || status=$?
          printf 'Absent saved profile: expected 1, got %s\n' "$status"
          test "$status" -eq 1

      - name: Package
        run: |
          mkdir -p pkg/bin pkg/data
          cp build/bin/couchplay pkg/bin/
          cp build/bin/couchplay-vdisplay pkg/bin/
          cp build/bin/couchplay-padfwd pkg/bin/
          cp -r data/* pkg/data/
          VERSION="${{ github.event.pull_request.number || 'develop' }}"
          tar -czf couchplay-${VERSION}-linux.tar.gz -C pkg .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couchplay-build
          path: couchplay-*.tar.gz
