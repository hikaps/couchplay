name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (required before checkout on a bare fedora:41 image)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh dbus-daemon

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Application smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          trap 'rm -rf -- "$smoke_root"' EXIT
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/config"
          export XDG_DATA_HOME="$smoke_root/data"
          export XDG_CACHE_HOME="$smoke_root/cache"
          export XDG_RUNTIME_DIR="$smoke_root/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software

          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --help

          status=0
          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --start || status=$?
          printf 'Missing --profile: expected 2, got %s\n' "$status"
          test "$status" -eq 2

          status=0
          timeout --kill-after=2s 15s dbus-run-session -- ./build/bin/couchplay --profile __couchplay_missing_smoke_profile__ || status=$?
          printf 'Absent saved profile: expected 1, got %s\n' "$status"
          test "$status" -eq 1

      - name: Package
        run: |
          mkdir -p pkg/bin pkg/data
          cp build/bin/couchplay pkg/bin/
          cp build/bin/couchplay-helper pkg/bin/
          cp scripts/install-helper.sh pkg/
          chmod +x pkg/install-helper.sh
          cp -r data/* pkg/data/
          VERSION="${{ github.event.pull_request.number || 'develop' }}"
          tar -czf couchplay-${VERSION}-linux.tar.gz -C pkg .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couchplay-build
          path: couchplay-*.tar.gz

  namespace:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Fedora 41 systemd test image
        run: docker build --file tests/namespace.Dockerfile --tag couchplay-namespace:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} .

      - name: Boot disposable privileged systemd container
        run: |
          set -euo pipefail
          name="couchplay-namespace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach \
            --name "$name" \
            --label couchplay.namespace-test=owned \
            --privileged \
            --cgroupns=host \
            --tmpfs /run:rw,nosuid,nodev,mode=755 \
            --tmpfs /run/lock:rw,nosuid,nodev,mode=755 \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
            "couchplay-namespace:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Build, install, and run real-kernel gate
        run: |
          set -euo pipefail
          name="couchplay-namespace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker exec "$name" bash -euc '
            export COUCHPLAY_NAMESPACE_CONTAINER=1
            for _ in $(seq 1 60); do
              if systemctl is-system-running --quiet 2>/dev/null; then break; fi
              sleep 1
            done
            systemctl start dbus-broker.service polkit.service
            test -S /run/dbus/system_bus_socket
            systemctl is-active --quiet polkit.service

            cmake -S /src -B /tmp/couchplay-build \
              -DBUILD_TESTING=ON \
              -DCOUCHPLAY_PRIVILEGED_TESTS=ON \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            cmake --build /tmp/couchplay-build --parallel 2

            install_root=/tmp/couchplay-install
            mkdir -p "$install_root"
            cp -a /src/scripts "$install_root/scripts"
            cp -a /src/data "$install_root/data"
            ln -s /tmp/couchplay-build "$install_root/build"
            "$install_root/scripts/install-helper.sh" install

            if ! ctest --test-dir /tmp/couchplay-build \
              --output-on-failure \
              --label-regex "^privileged$" \
              -R "^test_instance_bootstrap_integration$"; then
              journalctl --no-pager --since "10 minutes ago" || true
              systemctl list-units --all "couchplay-*" --no-pager || true
              exit 1
            fi
          '

      - name: Remove owned namespace-test container
        if: always()
        run: |
          name="couchplay-namespace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$name" >/dev/null 2>&1; then
            docker rm --force "$name"
          fi
