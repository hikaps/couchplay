name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (required before checkout on a bare fedora:41 image)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/couchplay/couchplay

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh dbus-daemon

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          mkdir -p pkg/bin pkg/data
          cp build/bin/couchplay pkg/bin/
          cp build/bin/couchplay-helper pkg/bin/
          cp scripts/install-helper.sh pkg/
          chmod +x pkg/install-helper.sh
          cp -r data/* pkg/data/
          VERSION="${{ github.event.pull_request.number || 'develop' }}"
          tar -czf couchplay-${VERSION}-linux.tar.gz -C pkg .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couchplay-build
          path: couchplay-*.tar.gz
